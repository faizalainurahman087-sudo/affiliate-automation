<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affiliate Automation</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080b12;
      color: #ffffff;
      min-height: 100vh;
    }

    .app {
      max-width: 520px;
      margin: auto;
      padding: 22px 16px 40px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: #8fffa8;
      background: #102317;
      padding: 8px 11px;
      border-radius: 20px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #35e76f;
    }

    .hero {
      background: linear-gradient(145deg, #151b29, #0d111a);
      border: 1px solid #252d3d;
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 15px;
    }

    .hero small {
      color: #8994a8;
      font-size: 12px;
    }

    .hero h1 {
      font-size: 27px;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    .hero p {
      color: #929caf;
      line-height: 1.5;
      font-size: 14px;
    }

    .card {
      background: #111621;
      border: 1px solid #222a39;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 13px;
    }

    .card-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .card-title h2 {
      font-size: 16px;
    }

